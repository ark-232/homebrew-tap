name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cask:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tap this checkout
        run: |
          taps=$(brew --repository)/Library/Taps/ark-232
          mkdir -p "$taps"
          ln -s "$GITHUB_WORKSPACE" "$taps/homebrew-tap"
      - run: brew style ark-232/tap
      - run: brew trust --cask ark-232/tap/dewline
      - run: brew audit --cask ark-232/tap/dewline
